<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>Buds ANC Lab</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Buds ANC Lab</h1>
<small>Uses your phone's mic. Keep volume low first.</small>

<div class="card">
  <div class="seg" id="modes">
    <button data-m="trans" class="on">Transparency</button>
    <button data-m="anc">Anti-noise (experimental)</button>
  </div>
  <label>Strength <span id="gv">1.0</span></label>
  <input type="range" id="gain" min="0" max="3" step="0.1" value="1">
  <label>Anti-noise cutoff <span id="fv">300 Hz</span></label>
  <input type="range" id="freq" min="80" max="800" step="10" value="300">
  <div class="bar"><i id="lvl"></i></div>
  <button id="go">Start</button>
  <small id="st">Idle.</small>
</div>

<div class="card">
  <b>Music</b>
  <input type="file" id="file" accept="audio/*">
  <audio id="aud" controls></audio>
  <small>Or play music from another app; this just adds the mic layer.</small>
</div>

<small>Bluetooth delay (100 ms or more) means anti-noise mode cannot truly cancel sound. Transparency mode works fine.</small>
<script src="app.js"></script>
</body>
</html>
